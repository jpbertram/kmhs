<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sperry A-13 reconstruction review</title><style>body{margin:0;background:#131b20;color:#eee;font:15px system-ui}header{position:absolute;left:24px;top:20px;max-width:440px;z-index:2;background:#131b20e8;padding:14px;border:1px solid #536067}h1{font-size:21px;margin:0 0 10px}button{background:#354047;color:#ffe39a;border:1px solid #748089;padding:10px;margin:4px 6px 4px 0}p{font-size:13px;line-height:1.5}canvas{display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="ball-turret.js"></script></head><body><header><h1>Sperry A-13 component review</h1><button id="outside">Exterior / orbit</button><button id="crew">Gunner eyeline</button><p>44-inch spherical envelope from AN 11-45G-1, Section II p.2. Structure follows Figures 2, 3 and 13. Window outlines, small components and eyepoint remain reconstruction estimates. Drag to orbit; wheel to zoom.</p><output id="status">Exterior review</output></header><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;scene.background=new THREE.Color(0x26343a);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd7e7f1,0x353a30,.8));const sun=new THREE.DirectionalLight(0xffeddd,1.3);sun.position.set(4,6,3);scene.add(sun);const fill=new THREE.DirectionalLight(0xb8ccdb,.5);fill.position.set(-3,2,-4);scene.add(fill);const built=KasselBallTurret.build(THREE);scene.add(built.group);let mode='outside',theta=.8,phi=1.15,radius=3.9,drag=false,lastX=0,lastY=0;
document.getElementById('outside').onclick=()=>{mode='outside';document.getElementById('status').textContent='Exterior review';};document.getElementById('crew').onclick=()=>{mode='crew';document.getElementById('status').textContent='Estimated gunner eyeline, rotating with turret elevation';};renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;theta+=(e.clientX-lastX)*.007;phi=Math.max(.15,Math.min(2.99,phi+(e.clientY-lastY)*.007));lastX=e.clientX;lastY=e.clientY;};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onwheel=e=>{e.preventDefault();radius=Math.max(2.5,Math.min(8,radius*Math.exp(e.deltaY*.001)));};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};function frame(){requestAnimationFrame(frame);if(mode==='crew'){camera.position.fromArray(built.eye);camera.lookAt(camera.position.clone().add(new THREE.Vector3().fromArray(built.look)));}else{camera.position.set(radius*Math.cos(theta)*Math.sin(phi),radius*Math.cos(phi),radius*Math.sin(theta)*Math.sin(phi));camera.lookAt(0,0,0);}renderer.render(scene,camera);}frame();
</script></body></html>
