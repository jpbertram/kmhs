<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kassel geometry review</title><style>body{margin:0;background:#182023;color:#e7e4da;font:15px system-ui}header{position:absolute;z-index:2;top:20px;left:20px;max-width:500px}button{padding:10px 18px;margin:5px;background:#273438;color:#ffe39a;border:1px solid #788477;border-radius:4px}small{display:block;color:#b7bcb9;margin:12px 0}canvas{display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><header><h1>Geometry review</h1><button id="fighter">Bf 109 reconstruction</button><button id="airman">Airman reconstruction</button><button id="rotate">Pause rotation</button><small>Reference-led reconstructions. Not schematic-certified aircraft or individual likenesses. Drag to orbit.</small><output id="status"></output></header><script src="historical-geometry.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.appendChild(renderer.domElement);scene.background=new THREE.Color(0x182023);scene.add(new THREE.HemisphereLight(0xd7e5ef,0x30322b,.8));const sun=new THREE.DirectionalLight(0xffedda,1.4);sun.position.set(8,15,10);scene.add(sun);const fill=new THREE.DirectionalLight(0xc3d1de,.5);fill.position.set(-8,3,-5);scene.add(fill);let model,kind,radius,rotation=0,auto=true,drag=false,lastX=0,lastY=0,phi=1.18;
function show(type){if(model)scene.remove(model);kind=type;model=type==='fighter'?KasselHistoricalGeometry.fighter(THREE):KasselHistoricalGeometry.airman(THREE);scene.add(model);radius=type==='fighter'?27:3.4;phi=1.18;rotation=.75;document.getElementById('status').textContent=type==='fighter'?'G-family proxy: tapered planform and framed canopy.':'Human proportions, flying clothing, boots, gloves and harness.';}document.getElementById('fighter').onclick=()=>show('fighter');document.getElementById('airman').onclick=()=>show('airman');document.getElementById('rotate').onclick=()=>{auto=!auto;document.getElementById('rotate').textContent=auto?'Pause rotation':'Resume rotation';};renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;rotation+=(e.clientX-lastX)*.008;phi=Math.max(.2,Math.min(2.8,phi+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY;};renderer.domElement.onpointerup=()=>drag=false;window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};show('fighter');let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(auto&&!drag)rotation+=dt*.15;let targetY=kind==='fighter'?0:-.20;camera.position.set(radius*Math.cos(rotation)*Math.sin(phi),targetY+radius*Math.cos(phi),radius*Math.sin(rotation)*Math.sin(phi));camera.lookAt(0,targetY,0);if(kind==='fighter')model.traverse(o=>{if(o.userData.glbProp)o.rotation.x+=dt*30;});renderer.render(scene,camera);}requestAnimationFrame(frame);
</script><script src="airman-anatomy.js"></script></body></html>
