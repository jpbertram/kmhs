<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>B-24 Liberator Cockpit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL viewport, one stenciled instrument-plate HUD in the corner, VR button bottom center. Single dark look by design. */
:root {
  --ground: #0d0f0b;
  --plate: rgba(28, 32, 24, 0.86);
  --plate-edge: #4a4e30;
  --stencil: #dcd6c2;
  --muted: #a3a48f;
  --lamp: #3bff63;
  --warn: #ff7a3a;
  --display: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--stencil); font-family: var(--mono); overflow: hidden; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#view:active { cursor: grabbing; }
.hud {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(320px, calc(100vw - 32px));
  background: var(--plate);
  border: 1px solid var(--plate-edge);
  border-radius: 3px;
  padding: 12px 14px;
  display: grid; gap: 10px;
  backdrop-filter: blur(4px);
}
.hud h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1; text-wrap: balance; }
.hud h1 small { display: block; font-size: 11px; letter-spacing: 0.22em; color: var(--muted); font-weight: 500; margin-top: 4px; }
.seats { display: flex; gap: 6px; flex-wrap: wrap; }
.seats button, #vr {
  font-family: var(--display); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  background: #1a1d16; color: var(--stencil); border: 1px solid var(--plate-edge); border-radius: 2px;
  padding: 6px 10px; font-size: 13px; cursor: pointer;
}
.seats button[aria-pressed="true"] { background: #4a4e30; border-color: #8a8c6a; }
.seats button:focus-visible, #vr:focus-visible, .hide:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.hint { margin: 0; font-size: 11px; line-height: 1.5; color: var(--muted); }
.hint b { color: var(--stencil); font-weight: 500; }
.hide { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--muted); font: 500 11px var(--mono); cursor: pointer; padding: 4px; }
.hud.min > :not(h1):not(.hide) { display: none; }
.vrbar {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; justify-items: end; gap: 6px; max-width: min(340px, calc(100vw - 32px)); text-align: right;
}
#vrnote { background: var(--plate); padding: 6px 8px; border-radius: 2px; }
#vrnote:empty { display: none; }
#vr { font-size: 16px; padding: 10px 22px; display: inline-flex; align-items: center; gap: 10px; background: var(--plate); }
#vr::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #3a3d33; box-shadow: none; }
#vr.ready::before { background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
#vr:disabled { cursor: default; color: var(--muted); }
#vrnote { font-size: 11px; color: var(--muted); max-width: 46ch; line-height: 1.45; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--warn); font-size: 13px; }
@media (max-width: 480px) { .hud h1 { font-size: 18px; } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { #vr.ready::before { box-shadow: none; } }
</style>

<canvas id="view" aria-label="3D view of a B-24 Liberator cockpit. Drag to look around."></canvas>
<div class="hud" id="hud">
  <button class="hide" id="hideHud" aria-expanded="true">hide</button>
  <h1>B-24 Liberator<small>Flight deck · 1:1 scale</small></h1>
  <div class="seats" role="group" aria-label="Viewpoint">
    <button data-seat="pilot" aria-pressed="true">Pilot</button>
    <button data-seat="copilot" aria-pressed="false">Co-pilot</button>
    <button data-seat="engineer" aria-pressed="false">Engineer</button>
  </div>
  <p class="hint"><b>Drag</b> to look around · <b>scroll</b> or pinch to zoom · keys <b>1 2 3</b> switch seats. In VR, pull a <b>trigger</b> to change seats.</p>
</div>
<div class="vrbar">
  <button id="vr" disabled>Checking for VR…</button>
  <div id="vrnote" aria-live="polite"></div>
</div>
<div id="err" hidden></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// B-24 cockpit builder. Units are meters, +Y up, pilot faces -Z.
// Pure function of THREE; draws its own canvas textures; returns merged meshes (one per material).
function buildCockpit(THREE, opts) {
  opts = opts || {};
  const forExport = !!opts.forExport;
  let seed = 1942;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = (a, b) => a + (b - a) * rnd();
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const D = Math.PI / 180;
  const FONT = 'Arial, Helvetica, "DejaVu Sans", sans-serif';

  function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function tex(c, repeat) {
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return t;
  }

  // ---------- worn paint ----------
  function wear(base, light, dark, chip, o) {
    const s = 512, c = cnv(s, s), g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 900; i++) { g.globalAlpha = R(0.03, 0.09); g.fillStyle = rnd() < 0.5 ? light : dark; g.beginPath(); g.arc(R(0, s), R(0, s), R(4, 40), 0, 7); g.fill(); }
    for (let i = 0; i < 6000; i++) { g.globalAlpha = R(0.05, 0.25); g.fillStyle = rnd() < 0.5 ? light : dark; g.fillRect(R(0, s), R(0, s), R(1, 2.5), R(1, 2.5)); }
    for (let i = 0; i < o.chips; i++) {
      const cx = R(0, s), cy = R(0, s), r = R(2, o.chipSize), k = 7 + (rnd() * 6 | 0);
      g.globalAlpha = R(0.5, 0.95); g.fillStyle = chip; g.beginPath();
      for (let j = 0; j < k; j++) { const a = j / k * Math.PI * 2, rr = r * R(0.4, 1.1); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * R(0.5, 1)); }
      g.closePath(); g.fill();
    }
    g.lineCap = 'round';
    for (let i = 0; i < o.scratches; i++) {
      g.globalAlpha = R(0.12, 0.45); g.strokeStyle = chip; g.lineWidth = R(0.5, 1.4);
      const x = R(0, s), y = R(0, s), a = R(0, Math.PI * 2), L = R(8, 70);
      g.beginPath(); g.moveTo(x, y);
      g.quadraticCurveTo(x + Math.cos(a) * L * 0.5 + R(-6, 6), y + Math.sin(a) * L * 0.5 + R(-6, 6), x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 14; i++) {
      const gx = R(0, s), gy = R(0, s), gr = R(40, 160), gg = g.createRadialGradient(gx, gy, 0, gx, gy, gr);
      gg.addColorStop(0, 'rgba(10,8,5,0.2)'); gg.addColorStop(1, 'rgba(10,8,5,0)'); g.fillStyle = gg; g.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }
    return c;
  }

  // ---------- gauge atlas (8x8 cells of 128px) ----------
  const GN = 8, GS = 128;
  const G = (label, o) => Object.assign({ label }, o);
  const gaugeDefs = [
    G('AIR SPEED', { nums: ['', '50', '100', '150', '200', '250', '300', '350'], unit: 'M.P.H.', arcs: [[0.12, 0.55, '#2f8f3a'], [0.55, 0.8, '#c9a227']] }),
    G('ALTITUDE', { kind: 'alt' }),
    G('GYRO HORIZON', { kind: 'att' }),
    G('TURN', { kind: 'turn' }),
    G('DIRECTIONAL GYRO', { kind: 'compass' }),
    G('RATE OF CLIMB', { start: 180, sweep: 340, nums: ['0', '1', '2', '3', '4', '5', '4', '3', '2', '1'], unit: '1000 FT/MIN' }),
    G('MANIFOLD PRESS', { nums: ['10', '20', '30', '40', '50', '60', '70'], unit: 'IN. HG', dual: true, arcs: [[0.35, 0.62, '#2f8f3a'], [0.62, 0.75, '#c9a227']] }),
    G('TACHOMETER', { nums: ['0', '5', '10', '15', '20', '25', '30', '35', '40'], unit: 'R.P.M.x100', dual: true, arcs: [[0.45, 0.6, '#2f8f3a']] }),
    G('FUEL PRESS', { nums: ['0', '5', '10', '15', '20', '25'], unit: 'LBS', arcs: [[0.55, 0.8, '#2f8f3a']] }),
    G('OIL TEMP', { nums: ['0', '20', '40', '60', '80', '100'], unit: 'DEG C', arcs: [[0.4, 0.75, '#2f8f3a'], [0.98, 1, '#b3261e']] }),
    G('OIL PRESS', { nums: ['0', '40', '80', '120', '160', '200'], unit: 'LBS', arcs: [[0.38, 0.5, '#2f8f3a']] }),
    G('CYL. TEMP', { nums: ['0', '50', '100', '150', '200', '250', '300'], unit: 'DEG C', arcs: [[0.5, 0.78, '#2f8f3a'], [0.85, 0.87, '#b3261e']] }),
    G('CARB. AIR', { nums: ['-50', '0', '50', '100', '150'], unit: 'DEG C', arcs: [[0.3, 0.45, '#c9a227']] }),
    G('CLOCK', { kind: 'clock' }),
    G('SUCTION', { nums: ['0', '2', '4', '6', '8', '10'], unit: 'IN. HG' }),
    G('FUEL', { nums: ['E', '1/4', '1/2', '3/4', 'F'], unit: 'GALS' }),
    G('AMPERES', { nums: ['0', '50', '100', '150'], unit: 'D.C.' }),
    G('FLAPS', { start: 200, sweep: 140, nums: ['UP', '1/2', 'DN'], unit: 'POSITION' }),
    G('HYD. PRESS', { nums: ['0', '400', '800', '1200', '1600'], unit: 'LBS' }),
    G('FREE AIR', { nums: ['-60', '-30', '0', '30', '60'], unit: 'DEG C' }),
  ];
  function cell(i) { return [(i % GN) * GS, ((i / GN) | 0) * GS]; }
  function gaugeFace(g, cx, cy, d) {
    const Rr = 60;
    g.save(); g.translate(cx, cy);
    g.fillStyle = '#2b2b29'; g.beginPath(); g.arc(0, 0, Rr, 0, 7); g.fill();
    const fg = g.createRadialGradient(-10, -12, 4, 0, 0, Rr);
    fg.addColorStop(0, '#1c1c1b'); fg.addColorStop(1, '#060606'); g.fillStyle = fg;
    g.beginPath(); g.arc(0, 0, Rr * 0.92, 0, 7); g.fill();
    const r = Rr * 0.86;
    const W = '#ecebdf';
    g.strokeStyle = W; g.fillStyle = W; g.textAlign = 'center'; g.textBaseline = 'middle';
    const needle = (a, len, w, col) => {
      g.save(); g.rotate(a); g.fillStyle = col || W; g.beginPath();
      g.moveTo(-len * 0.18, -w); g.lineTo(len, -w * 0.35); g.lineTo(len + 3, 0); g.lineTo(len, w * 0.35); g.lineTo(-len * 0.18, w); g.closePath(); g.fill(); g.restore();
    };
    const label = (txt, y, size) => { g.font = 'bold ' + (size || 8) + 'px ' + FONT; g.fillText(txt, 0, y); };
    if (d.kind === 'att') {
      g.save(); g.beginPath(); g.arc(0, 0, r, 0, 7); g.clip();
      const bank = R(-0.25, 0.25), pitch = R(-6, 6);
      g.rotate(bank); g.fillStyle = '#26384a'; g.fillRect(-r, -r, 2 * r, r + pitch); g.fillStyle = '#1b1712'; g.fillRect(-r, pitch, 2 * r, r);
      g.fillStyle = W; g.fillRect(-r, pitch - 1.5, 2 * r, 3);
      for (let i = -2; i <= 2; i++) if (i) g.fillRect(-10, pitch - i * 9, 20, 1.2);
      g.restore();
      g.lineWidth = 2;
      for (const a of [-60, -30, -20, -10, 0, 10, 20, 30, 60]) { g.save(); g.rotate((a - 90) * D); g.beginPath(); g.moveTo(r - (a % 30 ? 5 : 10), 0); g.lineTo(r, 0); g.stroke(); g.restore(); }
      g.strokeStyle = '#e08a2e'; g.lineWidth = 3; g.beginPath(); g.moveTo(-26, 0); g.lineTo(-8, 0); g.lineTo(-4, 5); g.lineTo(0, 0); g.lineTo(4, 5); g.lineTo(8, 0); g.lineTo(26, 0); g.stroke();
      g.fillStyle = W; label('GYRO HORIZON', r * 0.62, 6);
    } else if (d.kind === 'turn') {
      g.lineWidth = 2;
      for (const a of [-20, 0, 20]) { g.save(); g.rotate((a - 90) * D); g.fillRect(r - 12, -3, 12, 6); g.restore(); }
      needle((-90 + R(-12, 12)) * D, r * 0.72, 3.5);
      g.strokeStyle = W; g.lineWidth = 1.5; g.beginPath(); g.arc(0, -r * 0.9, r * 1.2, 70 * D, 110 * D); g.stroke();
      g.beginPath(); g.arc(0, -r * 0.9, r * 1.48, 70 * D, 110 * D); g.stroke();
      g.fillStyle = '#111'; g.beginPath(); g.arc(R(-6, 6), r * 0.44, 7, 0, 7); g.fill(); g.strokeStyle = W; g.stroke();
      g.fillStyle = W; label('TURN', -r * 0.35, 9);
    } else if (d.kind === 'compass') {
      const hdg = R(0, 360);
      g.save(); g.rotate(-hdg * D);
      for (let i = 0; i < 72; i++) { g.save(); g.rotate(i * 5 * D); g.fillRect(-0.7, -r, 1.4, i % 2 ? 4 : 8); g.restore(); }
      g.font = 'bold 13px ' + FONT;
      ['N', 'E', 'S', 'W'].forEach((t, i) => { g.save(); g.rotate(i * 90 * D); g.fillText(t, 0, -r + 18); g.restore(); });
      g.font = 'bold 8px ' + FONT;
      for (let i = 0; i < 12; i++) if (i % 3) { g.save(); g.rotate(i * 30 * D); g.fillText(String(i * 3), 0, -r + 17); g.restore(); }
      g.restore();
      g.fillStyle = '#e08a2e'; g.beginPath(); g.moveTo(0, -r + 1); g.lineTo(-4, -r - 6); g.lineTo(4, -r - 6); g.fill();
      g.strokeStyle = '#e08a2e'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, -12); g.lineTo(0, 12); g.moveTo(-12, 2); g.lineTo(12, 2); g.stroke();
    } else if (d.kind === 'clock' || d.kind === 'alt') {
      g.lineWidth = 1.5;
      const n = d.kind === 'clock' ? 12 : 10;
      for (let i = 0; i < 50; i++) { g.save(); g.rotate(i / 50 * Math.PI * 2); g.fillRect(-0.6, -r, 1.2, i % 5 ? 4 : 9); g.restore(); }
      g.font = 'bold 13px ' + FONT;
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 - Math.PI / 2; g.fillText(String(d.kind === 'clock' ? (i || 12) : i), Math.cos(a) * (r - 17), Math.sin(a) * (r - 17)); }
      label(d.kind === 'clock' ? 'ELAPSED TIME' : 'ALTITUDE', r * 0.38, 6);
      needle(R(0, 6.28), r * 0.5, 3.5);
      needle(R(0, 6.28), r * 0.8, 2.2);
      if (d.kind === 'alt') { g.fillStyle = '#0a0a0a'; g.fillRect(r * 0.18, -5, 20, 10); g.fillStyle = W; g.font = '7px ' + FONT; g.fillText('29.92', r * 0.18 + 10, 0); }
    } else {
      const st = (d.start === undefined ? 135 : d.start) * D, sw = (d.sweep || 270) * D;
      for (const [a0, a1, col] of (d.arcs || [])) { g.strokeStyle = col; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, r - 3, st + sw * a0, st + sw * a1); g.stroke(); }
      g.strokeStyle = W; const nums = d.nums, segs = nums.length - 1, minor = 5;
      for (let i = 0; i <= segs * minor; i++) { g.save(); g.rotate(st + sw * i / (segs * minor)); g.fillRect(r - (i % minor ? 5 : 10), -0.7, i % minor ? 5 : 10, i % minor ? 1.2 : 2); g.restore(); }
      g.font = 'bold ' + (nums.some((t) => t.length > 3) ? 8 : 10) + 'px ' + FONT;
      nums.forEach((t, i) => { const a = st + sw * i / segs; g.fillText(t, Math.cos(a) * (r - 20), Math.sin(a) * (r - 20)); });
      label(d.label, r * 0.4, d.label.length > 11 ? 6 : 7);
      label(d.unit || '', r * 0.58, 5);
      needle(st + sw * R(0.25, 0.75), r * 0.82, 2.6);
      if (d.dual) needle(st + sw * R(0.25, 0.75), r * 0.82, 2.0, '#d8c48a');
    }
    g.fillStyle = '#111'; g.beginPath(); g.arc(0, 0, 5, 0, 7); g.fill(); g.fillStyle = '#555'; g.beginPath(); g.arc(-1, -1, 2, 0, 7); g.fill();
    const hl = g.createLinearGradient(-r, -r, r * 0.3, r * 0.3); hl.addColorStop(0, 'rgba(255,255,255,0.14)'); hl.addColorStop(0.5, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.beginPath(); g.arc(0, 0, Rr * 0.92, 0, 7); g.fill();
    g.restore();
  }
  const gaugeCanvas = cnv(GN * GS, GN * GS);
  {
    const g = gaugeCanvas.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, GN * GS, GN * GS);
    for (let i = 0; i < GN * GN; i++) { const [x, y] = cell(i); gaugeFace(g, x + GS / 2, y + GS / 2, gaugeDefs[i % gaugeDefs.length]); }
  }
  const GT = {}; gaugeDefs.forEach((d, i) => { GT[d.label] = i; });
  let gaugeUse = {};
  function gaugeCell(label) { const base = GT[label]; const k = gaugeUse[label] = (gaugeUse[label] || 0); gaugeUse[label]++; return (base + gaugeDefs.length * (k % 3)) % (GN * GN); }

  // ---------- decal atlas (1024) ----------
  const decalCanvas = cnv(1024, 1024);
  const DR = {};
  {
    const g = decalCanvas.getContext('2d');
    const rect = (name, x, y, w, h, fn) => { DR[name] = [x, y, w, h]; g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.translate(x, y); fn(w, h); g.restore(); };
    const star = (cx, cy, r) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.382 : r; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } g.closePath(); g.fill(); };
    const scuff = (w, h, n) => { g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < n; i++) { g.globalAlpha = R(0.2, 0.8); g.beginPath(); g.arc(R(0, w), R(0, h), R(1, 6), 0, 7); g.fill(); } g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; };
    rect('star', 0, 0, 512, 256, (w, h) => {
      const cx = w / 2, cy = h / 2, r = 100;
      g.fillStyle = '#b8282a'; g.fillRect(cx - 230, cy - 46, 460, 92);
      g.fillStyle = '#e9e6dc'; g.fillRect(cx - 222, cy - 38, 444, 76);
      g.fillStyle = '#b8282a'; g.beginPath(); g.arc(cx, cy, r + 8, 0, 7); g.fill();
      g.fillStyle = '#1f2f5c'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.fillRect(cx - 222, cy - 38, 18, 76); g.fillRect(cx + 204, cy - 38, 18, 76);
      g.fillStyle = '#e9e6dc'; star(cx, cy, r * 0.98); g.fillRect(cx - 200, cy - 38, 120, 76); g.fillRect(cx + 80, cy - 38, 120, 76);
      scuff(w, h, 160);
    });
    rect('warning', 512, 0, 256, 128, (w, h) => {
      g.fillStyle = '#d8d2c0'; g.fillRect(4, 4, w - 8, h - 8); g.strokeStyle = '#a3201b'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
      g.fillStyle = '#a3201b'; g.font = 'bold 30px ' + FONT; g.textAlign = 'center'; g.fillText('WARNING', w / 2, 46);
      g.fillStyle = '#222'; g.font = 'bold 13px ' + FONT; g.fillText('DO NOT EXCEED 47 IN. HG', w / 2, 72); g.fillText('ABOVE 2550 R.P.M.', w / 2, 90); g.fillText('WITHOUT TURBO REGULATOR', w / 2, 108);
      scuff(w, h, 60);
    });
    rect('plate', 768, 0, 256, 128, (w, h) => {
      g.fillStyle = '#9c9a90'; g.fillRect(4, 4, w - 8, h - 8); g.fillStyle = '#1a1a18'; g.font = 'bold 15px ' + FONT; g.textAlign = 'center';
      g.fillText('CONSOLIDATED VULTEE', w / 2, 32); g.font = 'bold 26px ' + FONT; g.fillText('B-24J', w / 2, 66); g.font = '12px ' + FONT; g.fillText('A.A.F. SER. NO. 42-50762', w / 2, 92); g.fillText('SAN DIEGO  CALIF.', w / 2, 110);
      g.fillStyle = '#555'; for (const [x, y] of [[14, 14], [w - 14, 14], [14, h - 14], [w - 14, h - 14]]) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
    });

    rbox('dkgreen', 0.36, 0.2, 0.008, V(0, 0, 0.004), null, PL, 0.003);
    for (const [x, y] of [[-0.165, -0.085], [0.165, -0.085], [-0.165, 0.085], [0.165, 0.085], [0, 0.085], [0, -0.085]]) cyl('metal', 0.005, 0.005, 0.004, V(x, y, 0.009), [Math.PI / 2, 0, 0], PL, 8);
    const jx = s < 0 ? -0.085 : 0.085, sx = -jx;
    // junction box: body, overhanging lid, four lid screws, cable gland on the bottom
    rbox('khaki', 0.14, 0.15, 0.045, V(jx, 0.005, 0.0305), null, PL, 0.005);
    rbox('khaki', 0.148, 0.158, 0.006, V(jx, 0.005, 0.054), null, PL, 0.003);
    for (const [x, y] of [[-0.06, -0.065], [0.06, -0.065], [-0.06, 0.075], [0.06, 0.075]]) cyl('metal', 0.0055, 0.0055, 0.004, V(jx + x, y, 0.058), [Math.PI / 2, 0, 0], PL, 8);
    cyl('metal', 0.011, 0.011, 0.016, V(jx, -0.078, 0.03), null, PL, 12);
    // switch box: front plate, grille, rotary selector, two sockets with plugs
    rbox('khaki', 0.13, 0.17, 0.01, V(sx, 0, 0.013), null, PL, 0.004);
    rbox('dkgreen', 0.1, 0.14, 0.04, V(sx, -0.004, 0.038), null, PL, 0.006);
    for (let i = 0; i < 7; i++) box('black', 0.006, 0.03, 0.003, V(sx - 0.03 + i * 0.01, 0.042, 0.0585), null, PL);
    cyl('black', 0.018, 0.02, 0.014, V(sx, 0.002, 0.065), [Math.PI / 2, 0, 0], PL, 18); box('black', 0.006, 0.03, 0.008, V(sx, 0.002, 0.075), null, PL);
    for (const x of [-0.025, 0.025]) { cyl('metal', 0.011, 0.011, 0.008, V(sx + x, -0.048, 0.062), [Math.PI / 2, 0, 0], PL, 14); cyl('black', 0.008, 0.008, 0.022, V(sx + x, -0.056, 0.064), null, PL, 10); }
    // cables: out of the junction box gland and the two switch-box plugs, down into the bundle, clipped
    const plugPt = (x) => V(sx + x, -0.067, 0.064).applyMatrix4(PL), glandPt = V(jx, -0.087, 0.03).applyMatrix4(PL);
    tube('metal', [glandPt, WP(s, 0.68, zc + jx * s, 0.03), WP(s, 0.648, zc + jx * s, 0.03)], 0.006, 16);
    for (const [x, mat] of [[-0.025, 'tape'], [0.025, 'black']]) {
      const p0 = plugPt(x), zz = zc + (sx + x) * s;
      tube(mat, [p0, WP(s, 0.67, zz, 0.06), WP(s, 0.655, zz, 0.042), WP(s, 0.652, zz + 0.05, 0.034), WP(s, 0.652, 0.92, 0.034)], 0.0045, 40);
    }
  }
  // stenciled number on the left aft wall
  decal(WF(-1, 0.455, 0.67, 0.004), 'stencil', 0, 0, 0.27, 0.1, 0, 0.0015);

  // ---------- exterior: smooth nose, fuselage skin, airfoil wings, lathe nacelles ----------
  M.ext = std({ map: tex(wear('#4d4a2f', '#625e3e', '#2e2c1b', '#8f8c7c', { chips: 30, chipSize: 3, scratches: 60 }), true), roughness: 0.75, metalness: 0.1, side: THREE.DoubleSide }); M.ext.name = 'b24_ext';
  worldUV.ext = 0.5;
  const outward = (t, z, d) => inward(t, z, -d);
  // nose: the cockpit's front outline swept forward and closed in an ellipsoidal curve
  { const NL = 3.3, C = V(0, 0.55, 0);
    surface('ext', (u, v) => { const S0 = shellPt(u, ZW0 - 0.001), f = v, k = Math.sqrt(Math.max(0, 1 - f * f)); return V(C.x + (S0.x * 1.03 - C.x) * k, C.y + (S0.y - C.y) * k, ZW0 - 0.001 - NL * f); }, 96, 40, false); }
  // fuselage skin outside the cockpit walls, and the aft fuselage behind it
  surface('ext', (u, v) => outward(u * tS, lerp(ZW0, ZMAX, v), 0.035), 12, 40, false);
  surface('ext', (u, v) => outward(1 - tS + u * tS, lerp(ZW0, ZMAX, v), 0.035), 12, 40, false);
  surface('ext', (u, v) => outward(u, lerp(ZMAX, 7.5, v), 0.035), 96, 30, false);
  // wings: tapered airfoil, slight sweep and dihedral
  const yt = (x) => 5 * 0.15 * (0.2969 * Math.sqrt(x) - 0.126 * x - 0.3516 * x * x + 0.2843 * x * x * x - 0.1015 * x * x * x * x);
  const props = [];
  for (const s of S) {
    surface('ext', (u, v) => {
      const sx = 1.0 + 15.5 * v, c = lerp(3.6, 1.5, v), le = 1.15 + 0.06 * (sx - 1), yc = 1.42 + 0.03 * (sx - 1);
      const th = u * Math.PI * 2, xc = (1 + Math.cos(th)) / 2, sg = th < Math.PI ? 1 : -1;
      return V(s * sx, yc + sg * yt(xc) * c, le + xc * c);
    }, 48, 24, false);
    for (const nx of [3.4, 7.2]) {
      const ny = 1.2 + (nx - 1) * 0.03, zf = -0.55;
      const prof = [[0.001, 0], [0.42, 0.0], [0.5, 0.06], [0.64, 0.3], [0.7, 0.7], [0.69, 2.2], [0.6, 3.2], [0.36, 4.0], [0.1, 4.4], [0.001, 4.45]].map(([r, y]) => new THREE.Vector2(r, y));
      const g = new THREE.LatheGeometry(prof, 40); g.rotateX(Math.PI / 2); put('ext', g, T(s * nx, ny, zf));
      put('black', new THREE.CircleGeometry(0.43, 32), mul(T(s * nx, ny, zf + 0.04), new THREE.Matrix4().makeRotationY(Math.PI)));
      const sp = new THREE.LatheGeometry([[0.001, 0], [0.12, 0.05], [0.2, 0.18], [0.22, 0.32]].map(([r, y]) => new THREE.Vector2(r, y)), 24); sp.rotateX(-Math.PI / 2); put('black', sp, T(s * nx, ny, zf - 0.05));
      props.push(V(s * nx, ny, zf - 0.12));
    }
  }

  // ---------- merge into one mesh per material ----------
  const root = new THREE.Group(); root.name = 'B24_Cockpit';
  for (const k in B) {
    const list = B[k]; let n = 0; for (const g of list) n += g.attributes.position.count;
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
    const ws = worldUV[k]; let o = 0;
    for (const g of list) {
      const P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv, c = P.count;
      pos.set(P.array, o * 3); nor.set(N.array, o * 3);
      for (let i = 0; i < c; i++) {
        const j = o + i;
        if (ws) {
          const nx = Math.abs(nor[j * 3]), ny = Math.abs(nor[j * 3 + 1]), nz = Math.abs(nor[j * 3 + 2]);
          const x = pos[j * 3], y = pos[j * 3 + 1], z = pos[j * 3 + 2];
          let u, v; if (nx >= ny && nx >= nz) { u = z; v = y; } else if (ny >= nz) { u = x; v = z; } else { u = x; v = y; }
          uv[j * 2] = u * ws; uv[j * 2 + 1] = v * ws;
        } else if (U) { uv[j * 2] = U.array[i * 2]; uv[j * 2 + 1] = U.array[i * 2 + 1]; }
      }
      o += c; g.dispose();
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, M[k]); mesh.name = 'b24_' + k;
    if (k === 'glass') mesh.renderOrder = 2;
    if (k === 'decal') mesh.renderOrder = 1;
    root.add(mesh);
  }

  // lights that ship with the model
  const warm = new THREE.PointLight(0xff7a3a, 0.3, 0.8, 2); warm.position.set(-0.62, 1.05, -0.72); warm.name = 'b24_warm_lamp'; root.add(warm);
  const glow = new THREE.PointLight(0x46ff6e, 0.12, 0.4, 2); glow.position.set(0, 1.12, -0.86); glow.name = 'b24_green_glow'; root.add(glow);

  const propMeshes = [];
  let sky = null;
  if (!forExport) {
    const pm = new THREE.MeshBasicMaterial({ map: tex(propCanvas()), transparent: true, depthWrite: false, side: THREE.DoubleSide });
    for (const p of props) { const m = new THREE.Mesh(new THREE.CircleGeometry(1.75, 40), pm); m.position.copy(p); m.renderOrder = 3; root.add(m); propMeshes.push(m); }
    sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.MeshBasicMaterial({ map: tex(skyCanvas()), side: THREE.BackSide, depthWrite: false, fog: false }));
    sky.name = 'sky'; sky.renderOrder = -1; root.add(sky);
  }

  return {
    root, sky, clearance,
    seats: { pilot: V(-0.48, 1.18, 0.0), copilot: V(0.48, 1.18, 0.0), engineer: V(0.0, 1.42, 0.72) },
    update(t) {
      for (let i = 0; i < propMeshes.length; i++) propMeshes[i].rotation.z = t * (38 + i * 1.3);
    },
  };
}


const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.hidden = false;
  el.textContent = 'This browser could not start WebGL, so the cockpit cannot be drawn here. Try another browser or turn on hardware acceleration.';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
renderer.xr.setFoveation(1);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xcfdcea, 0x4a4630, 1.6));
const sun = new THREE.DirectionalLight(0xfff1d8, 2.6); sun.position.set(-4, 8, -3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd2e6, 0.5); fill.position.set(3, 4, 5); scene.add(fill);

const cockpit = buildCockpit(THREE);
scene.add(cockpit.root);

const camera = new THREE.PerspectiveCamera(72, 1, 0.02, 1500);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);

const SEATS = ['pilot', 'copilot', 'engineer'];
const START = { pilot: [0, -0.16], copilot: [0, -0.16], engineer: [0, -0.34] };
let seat = 'pilot', yaw = 0, pitch = 0;
function setSeat(name) {
  seat = name; rig.position.copy(cockpit.seats[name]);
  [yaw, pitch] = START[name];
  document.querySelectorAll('.seats button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.seat === name)));
}
setSeat('pilot');
document.querySelectorAll('.seats button').forEach((b) => b.addEventListener('click', () => setSeat(b.dataset.seat)));
addEventListener('keydown', (e) => { const i = '123'.indexOf(e.key); if (i >= 0) setSeat(SEATS[i]); });

const hud = document.getElementById('hud'), hideBtn = document.getElementById('hideHud');
hideBtn.addEventListener('click', () => { const min = hud.classList.toggle('min'); hideBtn.textContent = min ? 'show' : 'hide'; hideBtn.setAttribute('aria-expanded', String(!min)); });

// drag-to-look + zoom
const pointers = new Map(); let pinch0 = 0, fov0 = 72;
canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); fov0 = camera.fov; } });
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); setFov(fov0 * pinch0 / Math.max(d, 1)); return; }
  const k = (camera.fov / 72) * 0.0042;
  yaw += (e.clientX - px) * k; pitch += (e.clientY - py) * k;
  pitch = Math.max(-1.35, Math.min(1.35, pitch));
});
const up = (e) => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); setFov(camera.fov * (1 + Math.sign(e.deltaY) * 0.08)); }, { passive: false });
function setFov(f) { camera.fov = Math.max(30, Math.min(95, f)); camera.updateProjectionMatrix(); }

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// VR
const vrBtn = document.getElementById('vr'), vrNote = document.getElementById('vrnote');
function note(t) { vrNote.textContent = t; }
async function checkVR() {
  if (!('xr' in navigator)) { vrBtn.textContent = 'VR not available'; note('Open this page in your headset’s browser (Meta Quest Browser, Pico, Wolvic) to sit in the cockpit.'); return; }
  let ok = false;
  try { ok = await navigator.xr.isSessionSupported('immersive-vr'); } catch (e) { ok = false; }
  if (ok) { vrBtn.disabled = false; vrBtn.classList.add('ready'); vrBtn.textContent = 'Enter VR'; note('Sit down, face forward, then press Enter VR. Your head lands at the pilot’s eye point.'); }
  else { vrBtn.textContent = 'No headset found'; note('This browser has WebXR but no headset. On a Quest, open this same page in the Quest Browser.'); }
}
let session = null;
vrBtn.addEventListener('click', async () => {
  if (session) { session.end(); return; }
  try {
    session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
    await renderer.xr.setSession(session);
    vrBtn.textContent = 'Exit VR';
    session.addEventListener('end', () => { session = null; vrBtn.textContent = 'Enter VR'; });
  } catch (e) {
    session = null;
    note('The headset refused to start VR here (' + (e && e.message ? e.message : 'blocked') + '). If this page is shown inside another app, open it in the headset browser on its own.');
  }
});
checkVR();
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', () => setSeat(SEATS[(SEATS.indexOf(seat) + 1) % SEATS.length]));
  rig.add(c);
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  cockpit.update(t);
  if (!renderer.xr.isPresenting) { camera.rotation.set(0, 0, 0); camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch; camera.position.set(0, 0, 0); }
  renderer.render(scene, camera);
});
window.__set = (v) => { if (v.seat) setSeat(v.seat); if (v.yaw !== undefined) yaw = v.yaw; if (v.pitch !== undefined) pitch = v.pitch; if (v.fov) setFov(v.fov); if (v.pos) rig.position.set(v.pos[0], v.pos[1], v.pos[2]); };
window.__ready = true;
</script>
